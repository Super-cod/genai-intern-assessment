version: '3.8'

services:
  rag-qa:
    build:
      context: ./ps1-rag-qa
      dockerfile: Dockerfile
    container_name: rag-qa-service
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  doc-extraction:
    build:
      context: ./ps5-doc-extraction
      dockerfile: Dockerfile
    container_name: doc-extraction-service
    ports:
      - "8001:8001"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
